name: Integration

# Live tests against real upstream providers (Genius, lrcmux, metadata and
# trending sources). They depend on third-party uptime and rate limits, so
# they are kept out of the blocking CI workflow and run here instead:
# weekly, on demand, and on PRs that touch tests or sources.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/sources/**"
      - "src/metadata_extractor.py"
      - "src/trending_analytics.py"
      - "Test/**"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LYRICA_RUN_INTEGRATION: "1"
      GENIUS_TOKEN: ${{ secrets.GENIUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -m integration -ra -v
