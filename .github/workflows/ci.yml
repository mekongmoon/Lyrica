name: CI

on:
  # Pushes to main run CI via publish.yml, which gates the Docker image on it.
  pull_request:
  workflow_dispatch: {}
  # Lets publish/release workflows run the same checks before pushing images.
  workflow_call: {}

# Only PR runs supersede each other. Other runs (including calls from the
# publish and release workflows, where github.workflow resolves to the
# caller's name) get a unique group so they never cancel a caller's checks.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Blocking: rules that indicate real bugs (syntax errors, undefined names).
      - name: Ruff check (errors)
        run: ruff check --output-format=github --select E9,F63,F7,F82 src Test

      # Advisory: full ruleset from pyproject.toml. The existing codebase has
      # several hundred style findings (mostly tabs/whitespace and import
      # order); make this blocking once they are cleaned up.
      - name: Ruff check (full, advisory)
        continue-on-error: true
        run: ruff check --output-format=github src Test

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Live upstream tests are opt-in; see Test/conftest.py.
      LYRICA_RUN_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -ra
